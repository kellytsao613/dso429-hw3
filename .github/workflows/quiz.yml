name: Answer quiz rounds

on:
  schedule:
    # Twice an hour (UTC). GitHub sometimes starts scheduled runs late,
    # so two runs an hour keeps every round well inside the 3-hour full-credit window.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Answer new rounds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHECK_PRACTICE: "1"
          # Skip gemini-3.8-flash: it keeps returning "high demand" errors and slows every round down.
          GEMINI_MODELS: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash"
        run: python solve.py

      - name: Commit and push answers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answers logs
          if git diff --cached --quiet; then
            echo "No new answers."
            exit 0
          fi
          git commit -m "Answer rounds $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
